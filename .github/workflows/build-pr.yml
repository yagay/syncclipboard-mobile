name: build-pr

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    uses: ./.github/workflows/code-style.yml

  unit-tests:
    uses: ./.github/workflows/test.yml

  android-build:
    uses: ./.github/workflows/android-build.yml
